[package]
name = "water_http_utils"
version = "0.4.1-beta.10"
edition = "2021"
license = "MIT"
homepage = "https://github.com/HassanSharara"
repository = "https://github.com/HassanSharara/water_http_utils"
categories = ["network-programming", "web-programming::http-server" ]
keywords = ["http", "water_http", "water-http","water-server"]
description = "fast and efficient http utils for building structured http frameworks"

[dependencies]
chrono = {version = "0.4.41" , optional = true}
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
tokio = { version = "1.43.0", features = ["full"] }
memchr = "2.7.4"


[[bench]]
path = "benches/parser_becnh.rs"
required-features = ['server']
name = "bench"
harness = false


[features]
server = []
client = []
write_logs = ["chrono"]

[dev-dependencies]
criterion = "0.8.2"
httparse = "1.10.1"
